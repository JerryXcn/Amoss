name: Feature request / 功能建议
description: Describe the problem you want to solve / 描述希望解决的问题
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望的交互与行为
    validations:
      required: true
