name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package (Apple Silicon)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Ensure CMake is available
        run: command -v cmake || brew install cmake
      - name: Check environment and source
        run: |
          bash scripts/check-environment.sh
          bash scripts/check.sh
      - name: Build standalone application
        run: bash scripts/build.sh arm64
      - name: Test mirror protocol
        run: bash scripts/test-mirror.sh arm64
      - name: Check generated project
        run: git diff --exit-code -- Amoss.xcodeproj
      - name: Package and verify installer
        run: bash scripts/package.sh arm64
      - name: Upload development installer (not a public release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Amoss-arm64-development
          path: |
            dist/Amoss-*-arm64.dmg
            dist/Amoss-*-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
